name: Build RT60 Room Decay Corrector v16 Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'RT60-Room-Decay-Corrector-v16-source.zip'
      - '.github/workflows/build-rt60-v16-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate v16 source ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter 'RT60-Room-Decay-Corrector-v16-source.zip' -Recurse | Select-Object -First 1
          if (-not $zip) { throw 'v16 source ZIP not found' }
          "RT60_ZIP=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Expand source
        shell: pwsh
        run: |
          Remove-Item rt60-src -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path rt60-src | Out-Null
          Expand-Archive -Path $env:RT60_ZIP -DestinationPath rt60-src -Force
          $root = Get-ChildItem rt60-src -Directory | Select-Object -First 1
          if (-not $root) { throw 'Source root not found' }
          "RT60_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Audit required UI actions
        shell: pwsh
        run: |
          $cpp = Get-Content "$env:RT60_ROOT/src/standalone/MainComponent.cpp" -Raw
          $hpp = Get-Content "$env:RT60_ROOT/src/standalone/MainComponent.hpp" -Raw
          $plugin = Get-Content "$env:RT60_ROOT/src/plugin/PluginEditor.cpp" -Raw
          $processor = Get-Content "$env:RT60_ROOT/src/plugin/PluginProcessor.cpp" -Raw
          $required = @(
            'newMeasurementButton_.onClick',
            'measureButton_.onClick',
            'autoCorrectButton_.onClick',
            'saveProfileButton_.onClick',
            'loadProfileButton_.onClick',
            'startNewMeasurementSession()',
            'startMeasurement(false)',
            'startAutoCorrection()',
            'beginSaveProfileAs()',
            'beginLoadProfile()'
          )
          foreach ($token in $required) {
            if (-not $cpp.Contains($token)) { throw "Missing standalone action: $token" }
          }
          if ($hpp.Contains('demoButton_') -or $cpp.Contains('LOAD DEMO') -or $cpp.Contains('RE-MEASURE L + R')) {
            throw 'Removed/obsolete workflow button is still present'
          }
          if (-not $plugin.Contains('loadProfileButton_.onClick') -or -not $processor.Contains('loadProfileBundleFromFile')) {
            throw 'VST3 LOAD PROFILE action is not wired'
          }
          Write-Host 'UI/action audit passed.'

      - name: Core configure
        shell: pwsh
        run: cmake -S "$env:RT60_ROOT" -B rt60-core -A x64

      - name: Core build
        shell: pwsh
        run: cmake --build rt60-core --config Release

      - name: Core tests
        shell: pwsh
        run: ctest --test-dir rt60-core -C Release --output-on-failure

      - name: Configure Standalone and VST3
        shell: pwsh
        run: cmake -S "$env:RT60_ROOT" -B rt60-build -A x64 -DRT60_BUILD_JUCE=ON

      - name: Build Standalone and VST3
        shell: pwsh
        run: cmake --build rt60-build --config Release

      - name: Verify package contents
        shell: pwsh
        run: |
          $exe = Get-ChildItem rt60-build -Recurse -File -Filter 'RT60 Room Decay Corrector.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Standalone EXE not found' }
          $vst = Get-ChildItem rt60-build -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst) { throw 'VST3 bundle not found' }
          "RT60_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RT60_VST=$($vst.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Collect package
        shell: pwsh
        run: |
          Remove-Item artifact -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $env:RT60_EXE artifact/
          Copy-Item $env:RT60_VST artifact/ -Recurse
          Compress-Archive -Path artifact/* -DestinationPath RT60-Room-Decay-Corrector-v16-Windows-x64.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RT60-Room-Decay-Corrector-v16-Windows-x64
          path: RT60-Room-Decay-Corrector-v16-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
