name: Build RT60 Room Decay Corrector v0.2 FIXED

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Locate RT60 source ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "RT60-Room-Decay-Corrector-v0.2-source.zip" -Recurse | Select-Object -First 1
          if (-not $zip) { throw "Upload RT60-Room-Decay-Corrector-v0.2-source.zip into the repository first." }
          "RT60_ZIP=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Expand source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rt60-src | Out-Null
          Expand-Archive -Path $env:RT60_ZIP -DestinationPath rt60-src -Force
          $root = Get-ChildItem rt60-src -Directory | Select-Object -First 1
          if (-not $root) { throw "Source root not found." }
          "RT60_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch JUCE VST3 compatibility
        shell: pwsh
        run: |
          $cmake = Join-Path $env:RT60_ROOT "CMakeLists.txt"
          $text = Get-Content $cmake -Raw
          if ($text -notmatch 'JUCE_VST3_CAN_REPLACE_VST2') {
            $text = $text -replace 'if\(RT60_BUILD_JUCE\)\s*\r?\n', "if(RT60_BUILD_JUCE)`r`n    add_compile_definitions(JUCE_VST3_CAN_REPLACE_VST2=0)`r`n"
            Set-Content -Path $cmake -Value $text -Encoding utf8
          }

      - name: Configure core tests
        shell: pwsh
        run: cmake -S "$env:RT60_ROOT" -B rt60-build-core -A x64

      - name: Build core tests
        shell: pwsh
        run: cmake --build rt60-build-core --config Release

      - name: Run core and measurement tests
        shell: pwsh
        run: ctest --test-dir rt60-build-core -C Release --output-on-failure

      - name: Configure Standalone and VST3
        shell: pwsh
        run: cmake -S "$env:RT60_ROOT" -B rt60-build -A x64 -DRT60_BUILD_JUCE=ON

      - name: Build Standalone and VST3
        shell: pwsh
        run: cmake --build rt60-build --config Release

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $exe = Get-ChildItem rt60-build -Recurse -File -Filter "RT60 Room Decay Corrector.exe" | Select-Object -First 1
          if (-not $exe) { throw "Standalone EXE not found." }
          Copy-Item $exe.FullName artifact/

          $vst = Get-ChildItem rt60-build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $vst) { throw "VST3 bundle not found." }
          Copy-Item $vst.FullName artifact/ -Recurse

          Compress-Archive -Path artifact/* -DestinationPath artifact/RT60-Room-Decay-Corrector-v0.2-Windows.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RT60-Room-Decay-Corrector-v0.2-Windows
          path: artifact
          if-no-files-found: error
          retention-days: 30
