name: Prepare RT60 v0.5 source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand RT60 v0.4 source
        run: |
          rm -rf rt60-v05-source
          mkdir -p rt60-v05-source
          unzip -q RT60-Room-Decay-Corrector-v0.4-source.zip -d rt60-v05-source

      - name: Publish source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B rt60-v05-source
          git add rt60-v05-source
          git commit -m "Expand RT60 v0.4 source for v0.5 fixes" || true
          git push --force origin HEAD:rt60-v05-source
