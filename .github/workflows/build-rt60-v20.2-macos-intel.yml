name: Build RT60 Room Decay Corrector v20.2 macOS Intel

on:
  workflow_dispatch:
  push:
    paths:
      - 'RT60-Room-Decay-Corrector-v20.2-source.zip'
      - '.github/workflows/build-rt60-v20.2-macos-intel.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate v20.2 source ZIP
        shell: bash
        run: |
          ZIP=$(find . -name 'RT60-Room-Decay-Corrector-v20.2-source.zip' -print -quit)
          test -n "$ZIP" || { echo 'v20.2 source ZIP not found.' >&2; exit 1; }
          echo "RT60_ZIP=$(cd "$(dirname "$ZIP")" && pwd)/$(basename "$ZIP")" >> "$GITHUB_ENV"

      - name: Expand source
        shell: bash
        run: |
          rm -rf rt60-src && mkdir -p rt60-src
          unzip -q "$RT60_ZIP" -d rt60-src
          ROOT=$(find rt60-src -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$ROOT" || { echo 'Source root not found.' >&2; exit 1; }
          echo "RT60_ROOT=$(cd "$ROOT" && pwd)" >> "$GITHUB_ENV"

      - name: Audit v20.2 dashboard and real profile workflow
        shell: bash
        run: |
          CPP="$RT60_ROOT/src/standalone/MainComponent.cpp"
          HPP="$RT60_ROOT/src/standalone/MainComponent.hpp"
          MAIN="$RT60_ROOT/src/standalone/Main.cpp"
          PLUGIN="$RT60_ROOT/src/plugin/PluginEditor.cpp"
          PROCESSOR="$RT60_ROOT/src/plugin/PluginProcessor.cpp"
          BUNDLE="$RT60_ROOT/src/core/ProfileBundle.cpp"
          CMAKE="$RT60_ROOT/CMakeLists.txt"

          for token in \
            'newMeasurementButton_.onClick' \
            'measureButton_.onClick' \
            'autoCorrectButton_.onClick' \
            'saveProfileButton_.onClick' \
            'loadProfileButton_.onClick' \
            'startNewMeasurementSession()' \
            'startMeasurement(false)' \
            'startAutoCorrection()' \
            'beginSaveProfileAs()' \
            'beginLoadProfile()'; do
            grep -Fq "$token" "$CPP" || { echo "Missing real standalone action: $token" >&2; exit 1; }
          done

          for token in 'setSize(1536, 1024)' 'waterfallAfterGraph_' 'correctionCurveGraph_' \
                       'WORST FREQUENCY' 'IMPROVEMENT' 'PROFESSIONAL EDITION' \
                       'audioTypeSelector_' 'audioDeviceSelector_' 'sampleRateSelector_' 'bufferSizeSelector_'; do
            grep -Fq "$token" "$CPP" || grep -Fq "$token" "$HPP" || { echo "Missing dashboard element: $token" >&2; exit 1; }
          done

          ! grep -Fq 'demoButton_' "$HPP" || { echo 'Obsolete demo button remains.' >&2; exit 1; }
          ! grep -Fq 'RE-MEASURE L + R' "$CPP" || { echo 'Obsolete re-measure button remains.' >&2; exit 1; }
          grep -Fq 'loadProfileButton_.onClick' "$PLUGIN" || { echo 'VST3 LOAD PROFILE button is not wired.' >&2; exit 1; }
          grep -Fq 'loadProfileBundleFromFile' "$PROCESSOR" || { echo 'VST3 profile loader is missing.' >&2; exit 1; }
          grep -Fq 'RT60_STATE' "$PROCESSOR" || { echo 'VST3 embedded project profile state is missing.' >&2; exit 1; }
          grep -Fq 'PROFILE_BUNDLE' "$PROCESSOR" || { echo 'VST3 embedded bundle field is missing.' >&2; exit 1; }
          grep -Fq 'Base64::toBase64' "$PROCESSOR" || { echo 'VST3 embedded bundle encoding is missing.' >&2; exit 1; }
          grep -Fq 'RT60_PROFILE_BUNDLE 4' "$BUNDLE" || { echo 'Profile v4 is missing.' >&2; exit 1; }
          grep -Fq 'CHECKSUM ' "$BUNDLE" || { echo 'Profile checksum is missing.' >&2; exit 1; }
          grep -Fq 'replaceWithData' "$CPP" || { echo 'Exact-byte profile writer is missing.' >&2; exit 1; }
          grep -Fq 'activeMirrorRoundTrip' "$CPP" || { echo 'Active profile mirror readback verification is missing.' >&2; exit 1; }
          grep -Fq 'VERSION 20.2.0' "$CMAKE" || { echo 'CMake version is not 20.2.0.' >&2; exit 1; }
          grep -Fq '20.2.0' "$MAIN" || { echo 'App version is not 20.2.0.' >&2; exit 1; }
          grep -Fq 'micTestButton_.onClick' "$CPP" || { echo 'TEST MIC is not wired.' >&2; exit 1; }
          grep -Fq 'addAndMakeVisible(inputLevelMeter_)' "$CPP" || { echo 'Live microphone meter is not visible.' >&2; exit 1; }
          for token in 'setupCorrectionControl(targetSlider_' 'setupCorrectionControl(strengthSlider_' \
                       'setupCorrectionControl(maxCutSlider_' 'setupCorrectionControl(sweepLevelSlider_' \
                       'addAndMakeVisible(autoTargetToggle_)' 'addAndMakeVisible(correctionToggle_)' \
                       'CORRECTION AMOUNT' 'CORRECT UP TO'; do
            grep -Fq "$token" "$CPP" || { echo "v20.2 missing restored real control: $token" >&2; exit 1; }
          done
          ! grep -Fq 'setupHidden(strengthSlider_' "$CPP" || { echo 'Correction amount was hidden again.' >&2; exit 1; }
          ! grep -Fq 'setupHidden(maxCutSlider_' "$CPP" || { echo 'Correction range was hidden again.' >&2; exit 1; }
          grep -Fq 'startTimerHz(12)' "$CPP" || { echo 'v20 throttled UI timer is missing.' >&2; exit 1; }
          TIMER_BLOCK=$(sed -n '/void MainComponent::timerCallback()/,/void MainComponent::finishMeasurementOnMessageThread()/p' "$CPP")
          ! printf '%s' "$TIMER_BLOCK" | grep -Fq 'repaint();' || { echo 'Expensive full repaint remains inside timer callback.' >&2; exit 1; }
          grep -Fq 'RT60_WATERFALL 2' "$RT60_ROOT/src/core/WaterfallData.cpp" || { echo 'Waterfall v2 shared reference is missing.' >&2; exit 1; }
          grep -Fq 'relativeLevelOffsetDb' "$CPP" || { echo 'BEFORE/AFTER waterfall shared reference is not wired.' >&2; exit 1; }
          grep -Fq 'fromModeDetector' "$RT60_ROOT/src/core/CorrectionEngine.cpp" || { echo 'v20.2 ModeDetector/fallback origin fix is missing.' >&2; exit 1; }
          grep -Fq 'strongestModeShare' "$RT60_ROOT/src/core/CorrectionEngine.cpp" || { echo 'v20.2 candidate-family normalisation is missing.' >&2; exit 1; }
          grep -Fq 'detectedFrequencies' "$RT60_ROOT/src/core/CorrectionEngine.cpp" || { echo 'v20.2 coarse-overlap suppression is missing.' >&2; exit 1; }
          grep -Fq 'fallbackCfg.useModeDetector = false' "$CPP" || { echo 'v20.2 true conservative fallback retry is missing.' >&2; exit 1; }
          grep -Fq 'WaterfallAnalyzer::decayLevelDb(*data_, t, f)' "$RT60_ROOT/src/ui/WaterfallGraph.cpp" || { echo 'v20.2 WATERFALL graph is not using the tested decay display path.' >&2; exit 1; }
          grep -Fq 'Project recall restores this instance only' "$PROCESSOR" || { echo 'v20.2 project-state recall isolation fix is missing.' >&2; exit 1; }
          grep -Fq 'bundle.metadata.appMajor > 20' "$PROCESSOR" || { echo 'v20.2 newer-profile major check is wrong.' >&2; exit 1; }
          grep -Fq 'bundle.metadata.appMinor > 2' "$PROCESSOR" || { echo 'v20.2 newer-profile minor check is wrong.' >&2; exit 1; }
          grep -Fq 'test_mode_detector_fallback.cpp' "$CMAKE" || { echo 'v20.2 ModeDetector fallback regression test is missing.' >&2; exit 1; }
          echo 'v20.2 dashboard/action/profile audit passed.'

      - name: Configure core Intel
        shell: bash
        run: |
          cmake -S "$RT60_ROOT" -B rt60-core -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build core
        shell: bash
        run: cmake --build rt60-core --config Release

      - name: Core tests including exact profile file I/O
        shell: bash
        run: |
          ctest --test-dir rt60-core -C Release --output-on-failure
          ctest --test-dir rt60-core -C Release -R rt60_profile_file_io_tests --output-on-failure

      - name: Configure Standalone and VST3 CoreAudio Intel
        shell: bash
        run: |
          cmake -S "$RT60_ROOT" -B rt60-build -G Xcode -DRT60_BUILD_JUCE=ON \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build Standalone and VST3
        shell: bash
        run: cmake --build rt60-build --config Release

      - name: Verify Intel binaries
        shell: bash
        run: |
          APP=$(find rt60-build -type d -name 'RT60 Room Decay Corrector.app' -print -quit)
          test -n "$APP" || { echo 'Standalone APP not found.' >&2; exit 1; }
          BIN="$APP/Contents/MacOS/RT60 Room Decay Corrector"
          test -f "$BIN" || { echo 'Standalone binary not found.' >&2; exit 1; }
          file "$BIN" | grep -q 'x86_64' || { echo 'Standalone is not Intel x86_64.' >&2; exit 1; }
          VST=$(find rt60-build -type d -name '*.vst3' -print -quit)
          test -n "$VST" || { echo 'VST3 bundle not found.' >&2; exit 1; }
          VSTBIN=$(find "$VST/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          test -n "$VSTBIN" || { echo 'VST3 binary not found.' >&2; exit 1; }
          file "$VSTBIN" | grep -q 'x86_64' || { echo 'VST3 is not Intel x86_64.' >&2; exit 1; }
          echo "RT60_APP=$APP" >> "$GITHUB_ENV"
          echo "RT60_VST=$VST" >> "$GITHUB_ENV"

      - name: Collect Intel package
        shell: bash
        run: |
          rm -rf artifact && mkdir -p artifact
          cp -R "$RT60_APP" artifact/
          cp -R "$RT60_VST" artifact/
          ditto -c -k --sequesterRsrc --keepParent artifact RT60-Room-Decay-Corrector-v20.2-macOS-Intel.zip

      - name: Upload Intel package
        uses: actions/upload-artifact@v4
        with:
          name: RT60-Room-Decay-Corrector-v20.2-macOS-Intel
          path: RT60-Room-Decay-Corrector-v20.2-macOS-Intel.zip
          if-no-files-found: error
          retention-days: 30
